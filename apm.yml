name: ligeiro-mindware
version: 0.1.0
description: Portable Agent Skills for backend engineering, architecture and cloud-native systems.
author: nandoligeiro
license: MIT
targets: [claude, codex, agent-skills]
type: skill

dependencies:
  apm: []
  mcp: []

includes:
  - skills/

scripts:
  validate: python3 tools/skill-engineering/validate_skills.py --strict
  preview-claude: apm compile --dry-run --target claude
  preview-codex: apm compile --dry-run --target codex
  preview-agent-skills: apm compile --dry-run --target agent-skills
  pack: apm pack --archive -o ./dist
name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Agent Skills
        run: python3 tools/skill-engineering/validate_skills.py --strict
      - name: Validate L3 eval coverage
        run: python3 tools/skill-engineering/validate_evals.py --strict

skill: <skill-name>
scenarios:
  - id: should-trigger-basic
    category: should-trigger
    prompt: "<pedido que deve ativar a skill>"
    expected_activation: true
    expected_behaviors:
      - "<comportamento observável>"
    forbidden_behaviors:
      - "<comportamento que não pode ocorrer>"

  - id: should-not-trigger-neighbor
    category: should-not-trigger
    prompt: "<pedido próximo que pertence a outra skill>"
    expected_activation: false
    expected_behaviors: []
    forbidden_behaviors: []

  - id: incomplete-input
    category: incomplete
    prompt: "<pedido com dado obrigatório ausente>"
    expected_activation: true
    expected_behaviors:
      - "<pergunta mínima para destravar>"
    forbidden_behaviors:
      - "<não inventar o dado ausente>"
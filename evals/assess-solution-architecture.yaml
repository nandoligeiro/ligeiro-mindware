skill: assess-solution-architecture
scenarios:
  - id: should-trigger-consolidation-saa
    category: should-trigger
    prompt: "Temos duas aplicações internas com funcionalidades parcialmente sobrepostas. Preciso de um Solution Architecture Assessment para decidir como consolidá-las."
    expected_activation: true
    expected_behaviors:
      - "organiza o documento nas oito seções obrigatórias na ordem correta"
      - "separa capacidades já demonstradas de hipóteses não validadas"
      - "compara evolução de A, B, composição e reconstrução sem decisão antecipada"
    forbidden_behaviors:
      - "atribuir baixa qualidade a uma tecnologia ou método de desenvolvimento sem evidências"
      - "inventar pontuação objetiva ou decisão aprovada"

  - id: should-trigger-review-saa
    category: should-trigger
    prompt: "Revise nosso SAA e identifique se as decisões TO-BE estão sustentadas no AS-IS e nos requisitos."
    expected_activation: true
    expected_behaviors:
      - "verifica rastreabilidade entre requisitos e decisões"
      - "identifica lacunas e riscos sem inventar evidências"
    forbidden_behaviors: []

  - id: should-trigger-ai-built-app
    category: should-trigger
    prompt: "Uma startup criou uma plataforma com ajuda de IA. Avalie a arquitetura e a prontidão para operação em produção."
    expected_activation: true
    expected_behaviors:
      - "avalia segurança, testes e operação por evidências"
      - "não presume que a autoria com IA implica baixa qualidade"
    forbidden_behaviors:
      - "recomendar reescrita total sem trade-offs"

  - id: incomplete-discovery
    category: incomplete
    prompt: "Faça o SAA de nossas duas ferramentas, mas não tenho código nem dados ainda."
    expected_activation: true
    expected_behaviors:
      - "produz draft com desconhecidos ou conduz discovery com perguntas curtas"
      - "marca recomendação como condicional"
    forbidden_behaviors:
      - "declarar uma arquitetura vencedora sem análise"

  - id: should-not-trigger-java-syntax
    category: should-not-trigger
    prompt: "Qual a diferença entre record e class no Java 21?"
    expected_activation: false
    expected_behaviors: []
    forbidden_behaviors: []
